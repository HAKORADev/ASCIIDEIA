[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asciideia"
version = "0.0.1"
description = "Image and video to ASCII art converter, player, and renderer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "Pillow>=9.0.0",
]

[project.scripts]
asciideia = "asciideia.cli:main"
